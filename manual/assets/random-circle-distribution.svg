<title id="title">Two ways to choose random points inside a circle</title>
<desc id="desc">Uniform random radius clusters points near the center. Square-root adjusted radius spreads points evenly across the circle area.</desc>
<rect width="1000" height="520" rx="28" fill="#f5f3ed"/>
<text x="48" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="31" font-weight="700" fill="#1d1d1f">Same random() — different distribution.</text>
<text x="48" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#5c5852">Choosing radius uniformly over-samples the center. √random() makes equal areas equally likely.</text>
