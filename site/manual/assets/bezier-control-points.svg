<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Quadratic and cubic Bézier control points</title>
  <desc id="desc">Two diagrams showing how control points pull quadratic and cubic Bézier curves.</desc>
  <rect width="1000" height="560" rx="28" fill="#f5f3ed"/>
  <text x="48" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="31" font-weight="700" fill="#1d1d1f">Control points pull the curve; they are not points the curve must pass through.</text>
  <g transform="translate(55 120)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#1d1d1f">Quadratic</text>
    <line x1="30" y1="330" x2="210" y2="55" stroke="#9b978e" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="210" y1="55" x2="390" y2="330" stroke="#9b978e" stroke-width="2" stroke-dasharray="8 8"/>
    <path d="M30 330 Q210 55 390 330" fill="none" stroke="#2f6d80" stroke-width="6" stroke-linecap="round"/>
    <circle cx="30" cy="330" r="9" fill="#1d1d1f"/>
    <circle cx="210" cy="55" r="9" fill="#c15f2d"/>
    <circle cx="390" cy="330" r="9" fill="#1d1d1f"/>
    <text x="9" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#403d38">P0</text>
    <text x="187" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#c15f2d">control</text>
    <text x="370" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#403d38">P2</text>
  </g>
  <g transform="translate(535 120)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#1d1d1f">Cubic</text>
    <line x1="20" y1="330" x2="120" y2="50" stroke="#9b978e" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="120" y1="50" x2="300" y2="55" stroke="#9b978e" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="300" y1="55" x2="405" y2="330" stroke="#9b978e" stroke-width="2" stroke-dasharray="8 8"/>
    <path d="M20 330 C120 50 300 55 405 330" fill="none" stroke="#2f6d80" stroke-width="6" stroke-linecap="round"/>
    <circle cx="20" cy="330" r="9" fill="#1d1d1f"/>
    <circle cx="120" cy="50" r="9" fill="#c15f2d"/>
    <circle cx="300" cy="55" r="9" fill="#c15f2d"/>
    <circle cx="405" cy="330" r="9" fill="#1d1d1f"/>
    <text x="0" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#403d38">P0</text>
    <text x="88" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#c15f2d">control 1</text>
    <text x="268" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#c15f2d">control 2</text>
    <text x="385" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#403d38">P3</text>
  </g>
</svg>
